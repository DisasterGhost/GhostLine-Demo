name: Deploy to GitHub Pages

# HOLDING MODE (2026-06): serves ONLY the reconstruction page (static-landing/holding.html)
# + the rotating hero + CNAME. The full site (React app, /demo, landing, lineage, media)
# remains in the repo, just not deployed. To restore: `git revert` this commit.

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assemble holding page
        run: |
          mkdir -p dist
          cp static-landing/holding.html dist/index.html
          cp static-landing/hero-render.js dist/hero-render.js
          cp public/CNAME dist/CNAME
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
