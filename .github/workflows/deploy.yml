name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      # Copy static landing page to dist root
      - run: cp static-landing/index.html dist/index.html
      - run: cp static-landing/landing.css dist/landing.css
      # Copy shared assets (media, lineage, CNAME) to dist root
      - run: cp -r public/media dist/media 2>/dev/null || true
      - run: cp -r public/lineage dist/lineage 2>/dev/null || true
      - run: cp public/CNAME dist/CNAME 2>/dev/null || true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
